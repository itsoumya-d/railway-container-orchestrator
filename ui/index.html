<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>railway-container-orchestrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0812;
    --panel: #13111c;
    --line: #262626;
    --text: #f1f0ef;
    --muted: #c2beb9;
    --accent: #13044c;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 40px;
  }
  h1 {
    font-family: "Inter Tight", "Inter", sans-serif;
    font-size: 28px;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  input, button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  input { background: var(--panel); color: var(--text); min-width: 240px; }
  button {
    background: linear-gradient(#2d2a3c, #13044c);
    color: #fff;
    border-color: #313c3c;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .ok { color: var(--good); }
  .bad { color: var(--bad); }
  pre {
    background: #0a090b;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow: auto;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>railway-container-orchestrator</h1>
  <p class="sub">Spin containers up and down over a GraphQL API; diagnose failures with the deployment doctor.</p>

  <div class="row">
    <input id="name" placeholder="project name (e.g. demo-shop)" />
    <button id="create">Create project</button>
  </div>

  <div id="projects"></div>
  <pre id="out">ready</pre>

<script>
  const out = document.getElementById('out');
  const projectsEl = document.getElementById('projects');

  async function gql(operation, variables = {}) {
    const res = await fetch('/graphql', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ operation, variables }),
    });
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
    if (data.errors) throw new Error(data.errors.map(e => e.message).join('; '));
    return data.data;
  }

  async function refresh() {
    const { projects } = await gql('projects');
    projectsEl.innerHTML = '';
    if (!projects.length) {
      projectsEl.innerHTML = '<p class="sub">No projects yet.</p>';
      return;
    }
    for (const p of projects) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<b>${p.name}</b> <span class="mono">${p.id}</span>`;
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.onclick = async () => { await gql('projectDelete', { id: p.id }); await refresh(); };
      card.append(' ', del);
      projectsEl.appendChild(card);
    }
  }

  document.getElementById('create').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    if (!name) return;
    await gql('projectCreate', { name });
    await refresh();
  };

  refresh();
</script>
</body>
</html>
